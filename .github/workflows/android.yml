# Builds potfit's Android app (potfit/android) and keeps the APK as the run's artifact.
name: Android app

on:
  push:
    branches: [master]
    paths: ['potfit/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['potfit/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: potfit/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: potfit-android
          path: potfit/android/app/build/outputs/apk/debug/app-debug.apk
